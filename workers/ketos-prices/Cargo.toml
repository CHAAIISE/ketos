[package]
name = "ketos-prices"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast", "std", "zeroize"] }
zeroize = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi", target_env = "p2"))'.dependencies]
outlayer = "=0.2.1"
wasi-http-client = "=0.2.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
