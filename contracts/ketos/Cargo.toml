[package]
name = "ketos"
version = "0.1.0"
description = "Ketos perpetual futures markets with exit-liquidity-sized open interest"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["unstable"] }
near-contract-standards = { workspace = true }
ketos-hedge-common = { path = "../hedge-common" }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
ed25519-dalek = "2"
